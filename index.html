  --f-display:"Fredoka","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r-xl:36px;--r-l:28px;--r-m:20px;--r-s:14px;
  --t-hero:clamp(2.6rem,5.4vw,4.9rem);
  --t-h2:clamp(1.9rem,3.5vw,3rem);
  --t-h3:1.3rem;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blanco);color:var(--tinta);font:400 1.0625rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;font-weight:600;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px;border-radius:6px}
.on-dark :focus-visible,.hero :focus-visible,.pn-side :focus-visible,.ftr :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:1232px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== barra de demo ===== */
.demo-bar{background:var(--azul-prof);color:#fff;font-size:.8125rem;line-height:1.35}
.demo-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;flex-wrap:wrap}
.demo-bar p{min-width:0;flex:1 1 280px}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.8125rem;min-height:30px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--azul-prof)}

/* ===== aviso del día ===== */
.aviso{background:var(--azul-prof);color:#fff}
.aviso .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-block:10px;font-weight:600;text-align:center;flex-wrap:wrap}
.aviso .ico{color:var(--naranja)}

/* ===== botones ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;border:2px solid transparent;font:700 1rem/1 var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s ease,background-color .15s ease,color .15s ease;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-sm{min-height:42px;padding:0 18px;font-size:.9375rem}
.btn-navy{background:var(--azul-prof);color:#fff}
.btn-navy:hover{background:#001d4d}
.btn-naranja{background:var(--naranja);color:var(--azul-prof)}
.btn-naranja:hover{background:var(--naranja-hover)}
.btn-white{background:#fff;color:var(--azul-prof)}
.btn-white:hover{background:var(--celeste)}
.btn-line{background:transparent;color:var(--azul-prof);border-color:var(--azul-prof)}
.btn-line:hover{background:var(--azul-prof);color:#fff}
.btn-line-w{background:transparent;color:#fff;border-color:#fff}
.btn-line-w:hover{background:#fff;color:var(--azul-prof)}
.btn[disabled]{opacity:.5;pointer-events:none}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.link{color:var(--azul);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;cursor:pointer}
.link:hover{color:var(--azul-prof)}

/* ===== cabecera ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:60}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--linea)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:84px}
.brand{display:flex;align-items:center;cursor:pointer;flex:none}
.brand img{height:64px;width:auto}
.nav{display:none;gap:2px;margin-left:auto}
.nav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;font-weight:600;text-decoration:none;cursor:pointer;color:var(--tinta)}
.nav a:hover{background:var(--celeste)}
.nav a[aria-current="page"]{background:var(--celeste);color:var(--azul)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--naranja);flex:none}
.hdr-cta{display:flex;gap:10px;align-items:center;margin-left:auto}
.menu-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--azul-prof);background:#fff;color:var(--azul-prof);display:grid;place-items:center}
.mnav{border-top:1px solid var(--linea);background:#fff}
.mnav .wrap{display:grid;gap:4px;padding-block:12px}
.mnav a{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:14px;font-weight:600;text-decoration:none;cursor:pointer}
.mnav a:hover,.mnav a[aria-current="page"]{background:var(--celeste)}
@media(min-width:1000px){.nav{display:flex}.menu-btn{display:none}.hdr-cta{margin-left:8px}.mnav{display:none!important}}
@media(max-width:480px){.brand img{height:52px}.hdr-cta .btn{padding:0 14px}}

/* ===== portada ===== */
.hero{position:relative;background:var(--naranja);color:var(--azul-prof);overflow:hidden}
.hero-in{display:grid;gap:8px;align-items:end;grid-template-columns:minmax(0,1fr)}
.hero-copy{padding-block:48px 12px;position:relative;z-index:2}
.hero h1{font-weight:700;font-size:var(--t-hero);line-height:.96;letter-spacing:-.015em;max-width:11ch;color:#fff}
.hero .lead{margin-top:20px;font-size:1.1875rem;max-width:34ch;font-weight:500;line-height:1.5;color:#fff;font-weight:600}
.hero .cta-row{margin-top:28px}
.rating-chip{margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 16px 8px 14px;font-size:.9375rem;font-weight:500}
.rating-chip strong{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.stars{display:inline-flex;gap:2px;color:var(--naranja)}
.stars .ico{width:17px;height:17px;fill:currentColor;stroke:currentColor}
.stars .half{opacity:.4}
.hero-art{position:relative;padding:372px 0 44px;margin-inline:calc(var(--gut) * -1)}
.hero-blob{position:absolute;left:7%;top:92px;width:86%;max-width:640px;height:auto;aspect-ratio:1}
.hero-dog{position:absolute;left:62%;top:4px;width:min(64%,300px);transform:translateX(-50%);z-index:2;filter:drop-shadow(0 18px 24px rgba(0,41,107,.28))}
.hero-note{position:absolute;z-index:3;left:5%;top:20px;font:700 1.7rem/1.02 var(--f-hand);color:var(--azul-prof);max-width:9ch;transform:rotate(-4deg)}
.hero-note svg{display:none;margin:4px 0 0 58%;width:44px;height:auto;stroke:var(--azul-prof);fill:none;stroke-width:3;stroke-linecap:round}
.hero-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:clamp(48px,7vw,96px);z-index:4;display:block}
.hero-ticket{position:relative;z-index:5;margin:-92px 0 0;padding-inline:var(--gut)}
.hero-ticket .ticket-wrap{filter:none}
@media(min-width:900px){
  .hero-in{grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);min-height:640px}
  .hero-copy{padding-block:88px 130px}
  .hero-art{min-height:600px;padding:0;margin-inline:0}
  .hero-blob{left:auto;top:auto;right:-14%;bottom:-8%;width:112%}
  .hero-dog{left:50%;top:auto;bottom:-36px;width:min(82%,430px);transform:translateX(-46%)}
  .hero-note{left:0;top:34px;font-size:2.2rem;max-width:11ch}
  .hero-note svg{display:block;margin:6px 0 0 62%;width:52px}
  .hero-ticket{position:absolute;left:-8%;bottom:70px;width:min(500px,100%);margin:0;padding:0}
}
@media(prefers-reduced-motion:no-preference){
  .hero-blob{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
  .hero-dog{animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both}
  .hero-ticket .ticket-wrap{animation:drop .8s .45s cubic-bezier(.2,.9,.3,1.25) both}
}
@keyframes pop{from{transform:scale(.9)}to{transform:none}}
@keyframes rise{from{transform:translate(-50%,34px)}to{transform:translateX(-50%)}}
@media(min-width:900px){@keyframes rise{from{transform:translate(-46%,34px)}to{transform:translateX(-46%)}}}
@keyframes drop{from{transform:translateY(-22px) rotate(-6deg)}to{transform:rotate(-1.5deg)}}

/* ===== ticket de promoción ===== */
.ticket-wrap{filter:drop-shadow(0 10px 14px rgba(0,41,107,.14));transform:rotate(-1.5deg)}
.ticket-wrap.flat{transform:none;filter:drop-shadow(0 6px 14px rgba(0,41,107,.12))}
.ticket{--stub:128px;display:grid;grid-template-columns:var(--stub) minmax(0,1fr);background:#fff;color:var(--azul-prof);border-radius:22px;
  -webkit-mask:radial-gradient(circle 12px at var(--stub) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at var(--stub) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 12px at var(--stub) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at var(--stub) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.tk-stub{background:var(--azul);color:#fff;display:grid;place-content:center;text-align:center;padding:18px 8px;gap:2px}
.tk-big{font:700 clamp(2.4rem,5vw,3.1rem)/1 var(--f-display);letter-spacing:-.02em}
.tk-big.l{font-size:clamp(1.9rem,3.6vw,2.3rem)}
.tk-big.xl{font-size:clamp(1.6rem,3vw,1.9rem)}
.tk-small{font-size:.8125rem;font-weight:600;line-height:1.2;max-width:10ch;margin-inline:auto}
.tk-body{padding:16px 18px 16px 24px;display:grid;gap:8px;align-content:center;border-left:2px dashed var(--celeste-2);margin-left:-1px}
.tk-body h3{font-size:1.2rem;line-height:1.1}
.tk-conds{display:grid;gap:3px;font-size:.875rem;color:var(--tinta-suave);line-height:1.35}
.tk-conds li{display:flex;gap:8px;align-items:flex-start}
.tk-conds .ico{width:15px;height:15px;margin-top:2px;color:var(--naranja)}
.tk-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:4px}
.cd{display:inline-flex;align-items:center;gap:6px;background:var(--celeste);color:var(--azul-prof);border-radius:999px;padding:5px 12px 5px 10px;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
.cd .ico{width:15px;height:15px}
.cd.end{background:#EEE;color:#555}
@media(max-width:520px){.ticket{--stub:96px}.tk-body{padding:14px 14px 14px 18px}.tk-big{font-size:2.1rem}}

/* ===== secciones ===== */
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:grid;gap:14px;max-width:46rem;margin-bottom:clamp(28px,4vw,48px)}
.sec h2{font-size:var(--t-h2);font-weight:650}
.sec .sub{color:var(--tinta-suave);font-size:1.125rem;max-width:44ch}
.soft{background:var(--celeste)}
.peach{background:var(--durazno)}

/* ===== servicios en mosaico ===== */
.bento{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:22px;border-radius:var(--r-l);text-decoration:none;cursor:pointer;min-height:190px;overflow:hidden;transition:transform .2s ease;border:2px solid transparent;grid-column:span 1}
.tile:hover{transform:translateY(-4px)}
.tile h3{font-size:1.35rem;line-height:1.1}
.tile p{font-size:.9375rem;line-height:1.4;opacity:.92}
.tile .ico-big{width:46px;height:46px;stroke-width:1.75}
.tile .more{font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;font-size:.9375rem}
.tile .chip-in{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:.8125rem;font-weight:700;width:fit-content}
.t-azul{background:var(--azul);color:#fff;border-radius:var(--r-xl)}
.t-celeste{background:var(--celeste);color:var(--azul-prof)}
.t-naranja{background:var(--naranja);color:var(--azul-prof)}
.t-blanco{background:#fff;border-color:var(--linea);color:var(--azul-prof)}
.t-durazno{background:var(--durazno);color:var(--azul-prof)}
.t-foto{padding:0;color:var(--azul-prof);min-height:300px;background:#fff}
.t-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.t-foto .label{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:22px;padding:14px 16px;display:grid;gap:4px}
.t-big{grid-column:span 2}
@media(min-width:900px){
  .bento{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(190px,auto)}
  .t-consulta{grid-column:span 2;grid-row:span 2;padding:30px}
  .t-consulta h3{font-size:2.1rem}
  .t-consulta p{font-size:1.0625rem;max-width:30ch}
  .t-consulta .ico-big{width:68px;height:68px}
  .t-spa{grid-row:span 2}
  .t-diag{grid-column:span 2}
}
@media(max-width:899px){.t-consulta,.t-diag{grid-column:span 2}.t-spa{grid-column:span 2;min-height:340px}}
@media(max-width:520px){.bento{grid-template-columns:minmax(0,1fr)}.t-consulta,.t-diag,.t-spa{grid-column:span 1}}

/* ===== Plan Salud ===== */
.plan{background:var(--azul);color:#fff;position:relative;overflow:hidden}
.plan .wrap{position:relative;z-index:1}
.plan-grid{display:grid;gap:36px;align-items:center}
.plan h2{font-size:clamp(2.4rem,5vw,4.2rem);font-weight:700;line-height:.98}
.plan .sub{color:#DCE8FF;margin-top:14px;max-width:34ch}
.plan .cta-row{margin-top:26px}
.benefits{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.benefit{background:rgba(255,255,255,.1);border-radius:var(--r-m);padding:18px;display:grid;gap:10px;align-content:start}
.benefit .ib{width:46px;height:46px;border-radius:50%;background:var(--naranja);color:var(--azul-prof);display:grid;place-items:center}
.benefit h3{font-size:1.1rem;line-height:1.15}
.benefit p{font-size:.9rem;color:#DCE8FF;line-height:1.4}
@media(min-width:900px){.plan-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}.benefits{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.benefits{grid-template-columns:minmax(0,1fr)}}

/* ===== pasos para agendar ===== */
.steps{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.step .num{width:64px;height:64px;border-radius:50%;background:var(--naranja);color:var(--azul-prof);display:grid;place-items:center;font:700 1.9rem/1 var(--f-display)}
.step:nth-child(2) .num{background:var(--azul);color:#fff}
.step:nth-child(3) .num{background:var(--celeste-2)}
.step h3{font-size:1.3rem;margin-bottom:6px}
.step p{color:var(--tinta-suave);max-width:34ch}
@media(min-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}.step{grid-template-columns:minmax(0,1fr);gap:18px}}
.policy-strip{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9375rem;background:var(--celeste);color:var(--azul-prof)}
.pill .ico{width:18px;height:18px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--espera-bg);color:var(--espera)}

/* ===== confianza y ubicación ===== */
.trust{display:grid;gap:18px}
.card-rate{background:var(--celeste);border-radius:var(--r-xl);padding:clamp(24px,4vw,40px);display:grid;gap:14px;align-content:center}
.big-rate{font:700 clamp(4rem,10vw,7rem)/.9 var(--f-display);letter-spacing:-.03em;color:var(--azul)}
.card-where{background:var(--azul-prof);color:#fff;border-radius:var(--r-xl);padding:clamp(24px,4vw,40px);display:grid;gap:14px;align-content:center}
.card-where h3{font-size:clamp(1.6rem,3vw,2.2rem)}
.card-where .addr{font:600 clamp(1.4rem,2.6vw,1.9rem)/1.15 var(--f-display)}
.facts{display:grid;gap:8px;color:#DCE8FF}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts .ico{flex:none;margin-top:2px}
.facts .ico{color:var(--naranja)}
@media(min-width:900px){.trust{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}

/* ===== páginas internas ===== */
.page-hero{background:var(--celeste);padding-block:clamp(40px,6vw,76px)}
.page-hero.azul{background:var(--azul);color:#fff}
.page-hero.naranja{background:var(--naranja)}
.page-hero.durazno{background:var(--durazno)}
.page-hero-in{display:grid;gap:28px;align-items:center}
.page-hero h1{font-size:clamp(2.2rem,4.6vw,3.9rem);font-weight:700;line-height:1;letter-spacing:-.015em;max-width:15ch}
.page-hero .lead{margin-top:16px;font-size:1.1875rem;max-width:44ch;line-height:1.5}
.page-hero .cta-row{margin-top:24px}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;margin-bottom:18px;font-weight:600}
.crumb a{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumb .ico{width:14px;height:14px}
.svc-art{position:relative;aspect-ratio:1/.9;max-width:460px;width:100%;justify-self:center;display:grid;place-items:center}
.svc-art .shape{position:absolute;inset:0;width:100%;height:100%}
.svc-art .art-ico{position:relative;width:46%;height:46%;stroke-width:1.4}

@media(min-width:900px){.page-hero-in{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.two-col{display:grid;gap:40px}
@media(min-width:900px){.two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px}}
.checks{display:grid;gap:14px;margin-top:20px}
.checks li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.checks .ck{width:30px;height:30px;border-radius:50%;background:var(--naranja);color:var(--azul-prof);display:grid;place-items:center}
.checks .ck .ico{width:17px;height:17px;stroke-width:3}
.checks strong{display:block}
.checks span.d{color:var(--tinta-suave);font-size:.975rem}
.faq{margin-top:20px;display:grid;gap:10px}
.faq details{background:#fff;border:2px solid var(--linea);border-radius:var(--r-m);padding:0}
.faq summary{list-style:none;cursor:pointer;padding:16px 20px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .2s ease}
.faq details[open] summary .ico{transform:rotate(180deg)}
.faq details[open]{border-color:var(--azul)}
.faq .ans{padding:0 20px 18px;color:var(--tinta-suave);max-width:56ch}
.cta-band{background:var(--naranja);color:var(--azul-prof);border-radius:var(--r-xl);padding:clamp(28px,5vw,52px);display:grid;gap:18px;align-items:center}
.cta-band h2{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:700}
@media(min-width:800px){.cta-band{grid-template-columns:minmax(0,1fr) auto}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips a{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--linea);font-weight:700;text-decoration:none;cursor:pointer;background:#fff}
.chips a:hover{border-color:var(--azul);color:var(--azul)}
.svc-list{display:grid;gap:14px}
.svc-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 22px;border-radius:var(--r-l);border:2px solid var(--linea);text-decoration:none;cursor:pointer;background:#fff;transition:border-color .15s ease,transform .15s ease}
.svc-row:hover{border-color:var(--azul);transform:translateY(-2px)}
.svc-row .ib{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.svc-row h3{font-size:1.3rem}

.t-consulta>div:nth-child(2){max-width:56%}
.t-consulta .more{position:relative;z-index:1}

.svc-art .art-photo{position:absolute;top:0;right:0;width:90%;height:100%;border-radius:999px 999px 36px 36px;object-fit:cover;object-position:50% 14%}
.svc-art.has-dog{aspect-ratio:1/.9;max-width:420px;overflow:visible}

.page-hero{overflow:hidden}

const pad = n => String(n).padStart(2, "0");
function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pkey(k) { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function midnight(d) { const x = new Date(d || Date.now()); x.setHours(0, 0, 0, 0); return x; }
function mondayOf(d) { const x = midnight(d); const w = (x.getDay() + 6) % 7; return addDays(x, -w); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function fmtTime(d) { let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? "p. m." : "a. m."; h = h % 12 || 12; return h + ":" + pad(m) + " " + ap; }
function hourParts(h) { const p = h.split(":").map(Number); const ap = p[0] >= 12 ? "p. m." : "a. m."; return [(p[0] % 12 || 12) + ":" + pad(p[1]), ap]; }
function fmtEnd(ts) {
  const d = new Date(ts), t = midnight(), diff = Math.round((midnight(d) - t) / 864e5);
  if (diff === 0) return "las " + fmtTime(d);
  if (diff === 1) return "mañana a las " + fmtTime(d);
  return fmtLong(d) + " a las " + fmtTime(d);
}
function cdText(end) {
  let s = Math.floor((end - Date.now()) / 1000);
  if (s <= 0) return "Terminó";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d >= 1) return "Termina en " + d + " d " + h + " h";
  if (h >= 1) return "Termina en " + h + " h " + pad(m) + " min";
  return "Termina en " + m + " min " + pad(sec) + " s";
}

function seed() {

  /* lo anterior a hoy ya se atendió; lo de hoy mezcla estados */
  const nowHM = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes());
  list.forEach(c => { const di = Math.round((pkey(c.date) - t0) / 864e5); if (di < 0) c.st = "ok"; else if (di === 0) { if (c.st !== "espera") c.st = (c.h && c.h <= nowHM) ? "ok" : "conf"; } else if (c.st === "ok") c.st = "conf"; });
  /* garantizar actividad hoy: mover tres citas al día de hoy si hoy está vacío */
  const todays = list.filter(c => c.date === dkey(t0));
  if (todays.length < 3) {
    const extra = [
      C(td,"09:30","Lola","perro","Teresa F.","consulta","Revisión","conf"),

  const recs = [
    R("Max","perro","Carla M.","Vacuna anual",-3), R("Luna","gato","Jorge T.","Desparasitación",0), R("Rocky","perro","Rosa V.","Vacuna anual",2),

/* ===== utilidades de interfaz ===== */
function toast(msg) {
  const old = $("#toast"); if (old) old.remove();
  const t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = ico("circle-check") + "<span>" + esc(msg) + "</span>"; document.body.appendChild(t);
  clearTimeout(toast._t); toast._t = setTimeout(() => t.remove(), 2800);
}
function copyText(text, ok) {
  const done = () => toast(ok || "Copiado");
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(ta); ta.select(); let okc = false; try { okc = document.execCommand("copy"); } catch (e) {} ta.remove();
    if (okc) done(); else toast("Selecciona el texto y cópialo");
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (e) {}
  fallback();
}
let lastFocus = null;
function openModal(html, opts) {
  closeModal(true); opts = opts || {};
  lastFocus = document.activeElement;
  const back = document.createElement("div"); back.className = "modal-back"; back.id = "modal-back";
  back.innerHTML = '<div class="modal ' + (opts.wide ? "wide" : "") + '" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">' + html + "</div>";
  document.body.appendChild(back);
  const m = $(".modal", back); const f = $("input:not([type=hidden]),select,textarea,button", m);
  setTimeout(() => (f || m).focus(), 20);
  document.body.style.overflow = "hidden";
}
function closeModal(silent) {
  const b = $("#modal-back"); if (b) b.remove();
  document.body.style.overflow = "";
  if (!silent && lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
}

function buildMessage(c) {

/* ----- filas comunes ----- */
function apRow(c) {
  const t = c.h ? hourParts(c.h) : [c.slot, "por definir"];
  return '<button class="ap ' + (c.isNew ? "new" : "") + '" type="button" data-act="open-cita" data-id="' + c.id + '"><span class="when">' + t[0] + "<small>" + t[1] + '</small></span><span class="who"><strong>' + esc(c.pet) + " (" + esc(c.sp) + ")</strong><span>" + svName(c.svc) + ", " + esc(c.owner) + "</span></span>" + stChip(c.st) + "</button>";
}
function relDay(key) {
  const d = Math.round((pkey(key) - midnight()) / 864e5);
  if (d === 0) return "Hoy"; if (d === 1) return "Mañana"; if (d === -1) return "Ayer";
  if (d < 0) return "Hace " + (-d) + " días"; if (d < 15) return "En " + d + " días";
  return cap(fmtShort(pkey(key)));
}
function recChip(r) {
  if (r.sent) return chip("ok", "Enviado");
  const d = Math.round((pkey(r.date) - midnight()) / 864e5);
  if (d < 0) return chip("mal", "Vencido");
  if (d <= 3) return chip("espera", "Por vencer");
  return chip("conf", "Programado");
}
function recRow(r, compact) {
  return '<div class="rec' + (compact === true ? " compact" : "") + '"><div class="who"><strong>' + ico(r.sp === "gato" ? "cat" : "dog") + esc(r.pet) + "</strong><span>" + esc(r.owner) + ", " + esc(r.phone) + '</span></div><div class="what"><b>' + esc(r.what) + "</b>" + relDay(r.date) + '</div><div class="act" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + recChip(r) +
    '<button class="icon-btn" type="button" data-act="rec-send" data-id="' + r.id + '">' + ico("message-circle") + "Recordar</button></div></div>";
}

  if (S.weekDay == null) S.weekDay = (new Date().getDay() + 6) % 7;
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(mon, i));
  const btns = days.map((d, i) => '<button type="button" data-act="wday" data-i="' + i + '" aria-pressed="' + (S.weekDay === i) + '">' + fmtWk(d) + " " + d.getDate() + "</button>").join("");
  const cols = days.map((d, i) => {
    const k = dkey(d), cs = D.citas.filter(c => c.date === k).sort(sortCitas);
    return '<div class="wday ' + (k === today ? "today" : "") + " " + (S.weekDay === i ? "show" : "") + '"><h3>' + fmtWk(d) + "<small>" + d.getDate() + "</small></h3>" +
      (cs.length ? cs.map(c => { const t = c.h ? hourParts(c.h).join(" ") : c.slot; return '<button class="wcita ' + (c.isNew ? "new" : "") + " " + (c.st === "cancel" ? "cancel" : "") + '" type="button" data-act="open-cita" data-id="' + c.id + '"><b>' + t + "</b><span>" + esc(c.pet) + ", " + svName(c.svc) + "</span>" + (c.st === "espera" ? '<span style="color:var(--espera);font-weight:700">Por confirmar</span>' : "") + "</button>"; }).join("") : '<span class="empty-p" style="padding:6px">Sin citas</span>') + "</div>";
  }).join("");

    '<div class="dayrow" role="group" aria-label="Día de la semana">' + btns + '</div><div class="week">' + cols + '</div><p class="legend">' + chip("espera", "Por confirmar") + chip("conf", "Confirmada") + chip("ok", "Atendida") + "</p>";
}

/* ----- Vacunas y desparasitación ----- */
function tabVacunas() {
  const f = S.recFilter, t0 = dkey(midnight()), lim = dkey(addDays(midnight(), 15));
  let list = D.recs.slice().sort((a, b) => a.date.localeCompare(b.date));

/* ----- formulario de cita ----- */
function showErrs(errs, order) {
  $$(".err").forEach(e => { if (e.id && e.id.indexOf("e-") === 0) e.textContent = ""; });
  $$(".field.bad").forEach(f => f.classList.remove("bad"));
  let first = null;
  order.forEach(k => {
    if (!errs[k]) return;
    const el = $("#e-" + k); if (el) el.textContent = errs[k];
    const inp = $("#f-" + k) || $('input[name="' + k + '"]'); if (inp) { const f = inp.closest(".field"); if (f) f.classList.add("bad"); if (!first) first = inp; }
    if (!first && el) first = el;
  });
  if (first && first.focus) first.focus();
  else if (first) first.scrollIntoView({block: "center"});
}
function submitCita() {
  const g = id => $("#" + id);
  const chk = n => { const x = document.querySelector('input[name="' + n + '"]:checked'); return x ? x.value : ""; };
  const v = {svc:chk("svc"), sp:chk("sp"), slot:chk("slot"), pet:g("f-pet").value.trim(), motivo:g("f-motivo").value.trim(), date:g("f-date").value, owner:g("f-owner").value.trim(), phone:g("f-phone").value.trim(), addr:g("f-addr").value.trim(), policy:g("f-policy").checked};
  const errs = {};
  if (!v.svc) errs.svc = "Elige qué necesita tu mascota.";
  if (!v.sp) errs.sp = "Elige si es perro, gato u otra.";
  if (!v.pet) errs.pet = "Escribe el nombre de tu mascota.";
  if (!v.date || v.date < dkey(new Date())) errs.date = "Elige un día desde hoy.";
  if (!v.slot) errs.slot = "Elige mañana o tarde.";
  if (!v.owner) errs.owner = "Escribe tu nombre.";
  if (v.phone.replace(/\D/g, "").length < 9) errs.phone = "Escribe tu WhatsApp, de 9 dígitos.";
  if ((v.svc === "domicilio" || v.svc === "recojo") && !v.addr) errs.addr = "Escribe la dirección y el distrito.";
  if (!v.policy) errs.policy = "Marca que entiendes la política de citas.";
  showErrs(errs, ["svc", "sp", "pet", "date", "slot", "owner", "phone", "addr", "policy"]);
  if (Object.keys(errs).length) { S.ctx.form = v; return; }
  const promoEl = $("#f-promo"), promo = promoEl ? D.promos.find(p => p.id === promoEl.value) : null;
  const cita = {id:"c" + Math.random().toString(36).slice(2, 8), date:v.date, h:null, slot:v.slot, pet:v.pet, sp:v.sp, owner:v.owner, phone:v.phone, svc:v.svc, motivo:v.motivo, st:"espera", src:"web", isNew:true};
  if (v.addr && (v.svc === "domicilio" || v.svc === "recojo")) cita.addr = v.addr;
  D.citas.push(cita); save();
  const text = buildMessage(Object.assign({}, cita, {promoTxt: promo ? promo.big + " " + promo.bigSmall + " " + promo.title : ""}));
  S.ctx = {sent: {text: text, cita: cita}};
  render({top: true});
}

/* ----- acciones por clic ----- */
function act(name, el) {
  const id = el.dataset.id;
  const cita = id ? D.citas.find(c => c.id === id) : null;
  switch (name) {
    case "menu": S.menuOpen = !S.menuOpen; render(); break;
    case "wa": waPreview("Hola San Roque, quisiera información para mi mascota."); break;
    case "wa-plan": waPreview("Hola San Roque, quisiera más información sobre el Plan Salud."); break;
    case "wa-resched": waPreview("Hola San Roque, necesito reprogramar la cita de mi mascota.\n\nMi nombre: \nNombre de mi mascota: \nFecha de la cita: ", "Mensaje para reprogramar"); break;
    case "fab": go(S.route === "panel" ? "inicio" : "panel"); break;
    case "view-site": go("inicio"); break;
    case "view-panel": go("panel"); break;
    case "goto-panel": S.auth = true; S.tab = "hoy"; go("panel"); break;
    case "modal-close": closeModal(); break;
    case "tab": S.tab = el.dataset.tab; render({top: true}); break;
    case "logout": S.auth = false; render({top: true}); break;
    case "reset-demo": D = seed(); save(); render(); toast("Demo restablecida con datos de ejemplo"); break;
    case "open-cita": openCita(id); break;
    case "cita-new": openCitaNew(); break;
    case "cita-confirm": openConfirm(id); break;
    case "cita-confirm-ok": if (cita) { cita.h = $("#cf-h").value || cita.h || "09:00"; cita.st = "conf"; cita.isNew = false; save(); closeModal(); render(); toast("Cita confirmada. Copia el mensaje y envíalo por WhatsApp."); } break;
    case "cita-resched": openResched(id); break;
    case "cita-resched-ok": if (cita) { cita.date = $("#rs-d").value || cita.date; cita.h = $("#rs-h").value || "10:00"; cita.slot = null; cita.st = "conf"; save(); closeModal(); render(); toast("Cita reprogramada"); } break;
    case "cita-set": if (cita) { cita.st = el.dataset.st; cita.isNew = false; save(); closeModal(); render(); toast({ok:"Cita marcada como atendida", mal:"Cita marcada como no asistió", cancel:"Cita cancelada"}[el.dataset.st] || "Listo"); } break;
    case "wday": S.weekDay = Number(el.dataset.i); render(); break;
    case "rec-filter": S.recFilter = el.dataset.f; render(); break;
    case "rec-send": openRecSend(id); break;
    case "rec-sent": { const r = D.recs.find(x => x.id === id); if (r) { r.sent = true; save(); closeModal(); render(); toast("Recordatorio marcado como enviado"); } break; }
    case "rec-new": openRecNew(); break;
    case "promo-new": openPromoEdit(null); break;
    case "promo-edit": openPromoEdit(id); break;
    case "promo-toggle": { const p = D.promos.find(x => x.id === id); if (p) { p.active = !p.active; save(); render(); toast(p.active ? "Promoción activada" : "Promoción pausada: ya no se ve en la web"); } break; }
    case "promo-del": {
      if (el.dataset.arm) { D.promos = D.promos.filter(x => x.id !== id); save(); render(); toast("Promoción eliminada"); }
      else { el.dataset.arm = "1"; el.innerHTML = "Eliminar de verdad"; el.style.borderColor = "var(--alerta)"; el.style.color = "var(--alerta)"; setTimeout(() => { if (el.isConnected) { delete el.dataset.arm; el.innerHTML = ico("trash-2"); el.style.cssText = ""; } }, 3500); }
      break;
    }
    case "promo-tpl": { const t = PTPL[el.dataset.t]; if (t) { $("#pf-big").value = t.big; $("#pf-small").value = t.small; $("#pf-title").value = t.title; $("#pf-svc").value = t.svc; $("#pf-conds").value = t.conds; refreshPromoPrev(); } break; }
    case "reply-new": openReplyEdit(null); break;
    case "reply-edit": openReplyEdit(id); break;
  }
}
document.addEventListener("click", e => {
  if (e.target.id === "modal-back") { closeModal(); return; }
  const c = e.target.closest("[data-copy]");
  if (c) { e.preventDefault(); copyText(c.dataset.copy, "Mensaje copiado"); return; }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go, {svc: g.dataset.svc, promo: g.dataset.promo}); return; }
  const a = e.target.closest("[data-act]");
  if (a) { e.preventDefault(); act(a.dataset.act, a); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#modal-back")) closeModal(); else if (S.menuOpen) { S.menuOpen = false; render(); } }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "form-cita") submitCita();
  else if (id === "form-login") { S.auth = true; render({top: true}); }
  else if (id === "form-promo") submitPromo();
  else if (id === "form-rec") submitRec();
  else if (id === "form-reply") submitReply();
  else if (id === "form-newcita") submitNewCita();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "svc") { const f = $("#addr-field"); if (f) f.hidden = !(t.value === "domicilio" || t.value === "recojo"); }
  else if (t.id === "sw-mov") { D.aviso.movilidad = t.checked; save(); $("#mov-txt").textContent = t.checked ? "Hay servicio de movilidad" : "No hay servicio de movilidad"; $("#aviso-prev").innerHTML = avisoPreview(); toast(t.checked ? "Web: hay movilidad hoy" : "Web: aviso de «sin movilidad» publicado"); }
  else if (t.id === "sw-spec") { D.aviso.showSpecial = t.checked; save(); $("#aviso-prev").innerHTML = avisoPreview(); toast(t.checked ? "Aviso especial publicado en la web" : "Aviso especial oculto"); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "spec-text") { D.aviso.special = t.value; save(); $("#aviso-prev").innerHTML = avisoPreview(); }
  else if (t.closest && t.closest("#form-promo")) refreshPromoPrev();
});

/* ----- cuenta regresiva en vivo ----- */
function tick() {
  let ended = false;
  $$(".cd[data-end]").forEach(el => {
    const t = cdText(Number(el.dataset.end)); const s = $(".cdt", el); if (s && s.textContent !== t) s.textContent = t;
    if (t === "Terminó" && !el.classList.contains("end")) { el.classList.add("end"); ended = true; }
  });
  const ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (ended && !$("#modal-back") && !typing) render();
}

/* ----- arranque ----- */
(function init() {
  D = loadData();
  const h = location.hash.slice(1); S.route = ROUTES[h] ? h : "inicio";
  $("#fab").innerHTML = ico("layout-dashboard") + "Ver el panel de la clínica";
  const ld = document.createElement("script"); ld.type = "application/ld+json";
  ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"VeterinaryCare",name:CLINIC.name,telephone:"+51 984 978 988",address:{"@type":"PostalAddress",streetAddress:"Av. Simón Bolívar 1380",addressLocality:"Pueblo Libre",addressRegion:"Lima",addressCountry:"PE"},slogan:"Los mejores amigos de tu mejor amigo"});
  document.head.appendChild(ld);
  render({top: false});
  setInterval(tick, 1000);
})();

})();
</script>
